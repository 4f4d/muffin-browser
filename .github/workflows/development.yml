name: Muffin development verification

on:
  push:
    paths:
      - '.github/workflows/development.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'justfile'
      - 'tests/**'
      - 'tools/**'
      - 'ui/**'
  pull_request:
    paths:
      - '.github/workflows/development.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'justfile'
      - 'tests/**'
      - 'tools/**'
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned toolchain components and dependency auditor
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          if ! command -v cargo-audit; then brew install cargo-audit; fi
          mkdir -p target/ci-evidence
          {
            sw_vers
            uname -m
            rustc -Vv
            cargo -V
            node --version
            npm --version
            python3 --version
            cargo audit --version
          } > target/ci-evidence/environment.log
      - name: Run engineering verifier and native loopback smoke
        run: |
          set -o pipefail
          python3 tools/verify.py --artifacts target/ci-evidence/native \
            2>&1 | tee target/ci-evidence/verify.log
      - name: Write source-identified build record
        if: github.event_name != 'pull_request'
        run: python3 tools/write_ci_build_record.py
      - name: Upload verifier logs and any generated build record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muffin-development-macos-arm64
          path: target/ci-evidence/
          if-no-files-found: warn
          retention-days: 14
