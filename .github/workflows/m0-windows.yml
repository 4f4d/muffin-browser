name: M0 Windows feasibility
on:
  push:
    paths:
      - '.github/workflows/m0-windows.yml'
      - 'spikes/engine-floor/windows/**'
      - 'spikes/s1/**'
  pull_request:
    paths:
      - '.github/workflows/m0-windows.yml'
      - 'spikes/engine-floor/windows/**'
      - 'spikes/s1/**'
permissions:
  contents: read
jobs:
  engine-floor:
    runs-on: windows-2025
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and launch the native floor host
        run: ./spikes/engine-floor/windows/run.ps1
      - name: Build and exercise the S1 candidates in scope
        if: ${{ !cancelled() && hashFiles('spikes/s1/wry-tao/Cargo.toml') != '' }}
        run: |
          New-Item -ItemType Directory -Path 'm0-artifacts' -Force | Out-Null
          @("source_commit=$env:GITHUB_SHA", "runner_image=$env:ImageOS/$env:ImageVersion") | Set-Content 'm0-artifacts/s1-build.txt'
          rustc -Vv | Add-Content 'm0-artifacts/s1-build.txt'
          $failed = $false
          $candidates = @('wry-tao')
          if (!(Test-Path 'spikes/s1/wry-tao/src/bin/muffin-s2a-popup.rs')) { $candidates += 'tauri' }
          foreach ($candidate in $candidates) {
            $manifest = "spikes/s1/$candidate/Cargo.toml"
            if ($candidate -eq 'tauri') { $manifest = 'spikes/s1/tauri/src-tauri/Cargo.toml' }
            if (!(Test-Path $manifest)) { continue }
            if ($candidate -eq 'wry-tao') {
              $name = 'muffin-s1-wry'
              $title = 'Muffin S1 WRY TAO'
            } else {
              $name = 'muffin-s1-tauri'
              $title = 'Muffin S1 Tauri'
            }
            cargo build --locked --manifest-path $manifest --bin $name --target-dir "$env:RUNNER_TEMP/muffin-$candidate" 2>&1 | Tee-Object "m0-artifacts/s1-$candidate-build.txt"
            if ($LASTEXITCODE -ne 0) { $failed = $true; continue }
            $binary = Join-Path "$env:RUNNER_TEMP/muffin-$candidate" "debug/$name.exe"
            Copy-Item $binary m0-artifacts/
            (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLower() | Set-Content "m0-artifacts/s1-$candidate-binary.sha256"
            pwsh -File spikes/s1/capture-windows.ps1 -Binary $binary -Title $title -Stem "m0-artifacts/s1-windows-$candidate"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Exercise loopback popup fixture on Windows Server
        if: ${{ !cancelled() && hashFiles('spikes/s1/followup/s2a_fixture.py') != '' }}
        run: |
          $target = "$env:RUNNER_TEMP/muffin-wry-tao"
          New-Item -ItemType Directory -Path 'm0-artifacts' -Force | Out-Null
          @("source_commit=$env:GITHUB_SHA", "runner_image=$env:ImageOS/$env:ImageVersion",
            "os=$([System.Environment]::OSVersion.Version)", "architecture=$env:PROCESSOR_ARCHITECTURE") |
            Set-Content 'm0-artifacts/s2a-build.txt'
          rustc -Vv | Add-Content 'm0-artifacts/s2a-build.txt'
          cargo -V | Add-Content 'm0-artifacts/s2a-build.txt'
          python --version | Add-Content 'm0-artifacts/s2a-build.txt'
          cargo build --locked --manifest-path spikes/s1/wry-tao/Cargo.toml --bin muffin-s2a-popup --target-dir $target 2>&1 |
            Tee-Object -FilePath 'm0-artifacts/s2a-build.txt' -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $target 'debug/muffin-s2a-popup.exe'
          (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLower() | Add-Content 'm0-artifacts/s2a-build.txt'
          Copy-Item $binary m0-artifacts/
          python spikes/s1/followup/s2a_fixture.py --binary $binary --work-dir 'm0-artifacts/s2a-windows' --timeout-seconds 90 --auto
          exit $LASTEXITCODE
      - name: Exercise everyday features on Windows Server
        if: ${{ !cancelled() && hashFiles('spikes/s1/followup/s4_fixture.py') != '' }}
        run: |
          $target = "$env:RUNNER_TEMP/muffin-wry-tao"
          $work = "$env:RUNNER_TEMP/s4-windows"
          $out = 'm0-artifacts/s4-windows'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          @("source_commit=$env:GITHUB_SHA", "runner_image=$env:ImageOS/$env:ImageVersion",
            "os=$([System.Environment]::OSVersion.Version)", "architecture=$env:PROCESSOR_ARCHITECTURE") |
            Set-Content 'm0-artifacts/s4-build.txt'
          rustc -Vv | Add-Content 'm0-artifacts/s4-build.txt'
          cargo -V | Add-Content 'm0-artifacts/s4-build.txt'
          python --version | Add-Content 'm0-artifacts/s4-build.txt'
          cargo build --locked --manifest-path spikes/s1/wry-tao/Cargo.toml --bin muffin-s4-features --target-dir $target 2>&1 |
            Tee-Object -FilePath 'm0-artifacts/s4-build.txt' -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $target 'debug/muffin-s4-features.exe'
          (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLower() | Add-Content 'm0-artifacts/s4-build.txt'
          Copy-Item $binary m0-artifacts/
          python spikes/s1/followup/s4_fixture.py --binary $binary --work-dir $work --timeout-seconds 80
          $fixtureExit = $LASTEXITCODE
          Get-ChildItem -File $work | Where-Object { $_.Extension -in '.log','.json','.jsonl' } | Copy-Item -Destination $out
          exit $fixtureExit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-m0
          path: m0-artifacts/
          retention-days: 7
