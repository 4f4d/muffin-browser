# Guard: STATUS.json must equal generator output; result records and M0b evidence must validate.
name: status-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (verified release commit: github.com/actions/checkout/releases/tag/v7.0.1)
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: result records are checked against real commits
      - name: Run status-generator regression tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate generated status
        run: python3 tools/gen_status.py --check
