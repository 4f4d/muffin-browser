[package]
name = "muffin"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tao = "=0.37.2"
url = "2.5.9"
wry = "=0.57.2"
rusqlite = { version = "=0.43.0", features = ["bundled", "cache"] }
html5ever = "=0.40.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
block2 = "=0.6.2"
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSURLRequest", "NSURLResponse"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "WKFindConfiguration", "WKFindResult", "WKPDFConfiguration", "WKDownload", "WKDownloadDelegate", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "block2"] }
rfd = { version = "=0.16.0", default-features = false }
