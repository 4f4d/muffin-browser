[package]
name = "muffin"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tao = "=0.37.2"
url = "2"
wry = "=0.57.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
block2 = "=0.6.2"
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "block2"] }
