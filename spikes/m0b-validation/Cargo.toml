[package]
name = "muffin-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tao = "=0.37.2"
tempfile = "=3.27.0"
url = "=2.5.8"
wry = "=0.57.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_34"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKUIDelegate", "WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "=0.22.1"
dunce = "=1.0.5"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
